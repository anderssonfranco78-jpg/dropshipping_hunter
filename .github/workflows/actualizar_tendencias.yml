name: 🤖 Dropshipping Hunter Cloud Bot

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC (06:00 AM hora de El Salvador)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite presionar un botón en GitHub para ejecutarlo manualmente cuando quieras

concurrency:
  group: hunter-cloud-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar-tendencias:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del cazador
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Si alguna prueba falla, no se publica nada.
      - name: Pruebas (no abren navegador)
        run: |
          python -m unittest discover -s tests -t .

      # Lee data/user_products.json (costos de DSers que anota el operador) y mide el mercado real:
      # Google Trends (semanal, 12 meses) + YouTube Shorts, y unas pocas ideas del Radar.
      # Sin datos inventados: si una fuente falla queda "Sin datos". AliExpress/Selenium sigue apagado.
      - name: Ejecutar motor de auditoría
        run: |
          python main.py

      # Blindaje: el robot jamás debe modificar el archivo del operador.
      - name: Verificar que user_products.json no fue modificado
        run: |
          if ! git diff --quiet -- data/user_products.json; then
            echo "::error::El robot modificó data/user_products.json. Se aborta la publicación."
            exit 1
          fi

      # index.html es estático y lee data/dashboard_data.js. ranking_productos.html es el panel clásico.
      - name: Guardar y publicar actualizaciones automáticas
        run: |
          git config --global user.name "Dropshipping Hunter Bot"
          git config --global user.email "bot@dropshipping-hunter.local"
          # todo lo generado en data/ (user_products.json ya se verificó intacto arriba) + panel clásico + dossier
          git add -A data ranking_productos.* dossier_productos_ganadores.md
          if ! git diff --staged --quiet; then
            git commit -m "🤖 chore(auto): actualización diaria de tendencias y auditoría [skip ci]"
            # el PC también sube datos: si chocan, ganan los de esta corrida (el historial nunca choca)
            git pull --rebase --autostash -X theirs
            git push
          else
            echo "No se detectaron cambios hoy."
          fi
